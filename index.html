<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>东方Project原曲听力</title>
    <!--保留-->
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: radial-gradient(ellipse at 50% 0%, #1a3320, #0f1f12 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #d0f0dc;
        }

        /* ===== 主容器（玻璃卡片） ===== */
        #app {
            width: 100%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(92, 219, 138, 0.15);
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: all 0.3s;
        }

        /* ===== 标题 ===== */
        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #8fdfb0, #5cdb8a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 4px;
        }
        .subhead {
            text-align: center;
            font-size: 13px;
            color: rgba(92, 219, 138, 0.5);
            border-bottom: 1px solid rgba(92, 219, 138, 0.1);
            padding-bottom: 18px;
            margin-bottom: 22px;
            letter-spacing: 4px;
        }

        /* ===== 面板 ===== */
        .panel {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 18px;
            border: 1px solid rgba(92, 219, 138, 0.06);
        }
        .panel-title {
            font-weight: 600;
            font-size: 13px;
            color: #7dca9a;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        /* ===== 难度 & 选项卡片 ===== */
        .diff_card {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .diff_card label,
        .option-btn {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px 12px;
            border: 1px solid rgba(92, 219, 138, 0.2);
            padding: 12px 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: 0.2s;
            color: #c8e8d4;
            font-weight: 500;
            width: 100%;
            font-family: inherit;
            font-size: 16px;
            text-align: left;
        }
        .diff_card label:hover,
        .option-btn:hover:not(:disabled) {
            border-color: rgba(92, 219, 138, 0.5);
            background: rgba(92, 219, 138, 0.08);
        }
        .diff_card label:has(input:checked) {
            border-color: #5cdb8a;
            background: rgba(92, 219, 138, 0.12);
            box-shadow: 0 0 24px rgba(92, 219, 138, 0.04);
        }
        .diff_card label input {
            accent-color: #5cdb8a;
            margin-right: 10px;
            width: 16px;
            height: 16px;
        }

        /* ===== 难度小字 ===== */
        .diff_card label .diff-name {
            font-weight: 600;
            font-size: 1rem;
        }
        .diff_card label .diff-meta {
            font-size: 0.7rem;
            opacity: 0.6;
            width: 100%;
            padding-left: 28px;
            margin-top: -4px;
            margin-bottom: 2px;
        }

        /* ===== 模式选择（与难度卡片风格统一，未选中灰色） ===== */
        .mode_card {
            margin: 12px 0 0;
        }
        .mode_card label {
            /* 和 .diff_card label 保持一致 */
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);   /* 灰色边框 */
            padding: 12px 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);          /* 非常淡的灰色背景 */
            cursor: pointer;
            transition: 0.25s;
            color: rgba(255, 255, 255, 0.3);                /* 灰色文字 */
            font-weight: 500;
            width: 100%;
            font-family: inherit;
            font-size: 16px;
            text-align: left;
        }

        /* 悬停时微微提亮 */
        .mode_card label:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.05);
        }

        /* 当复选框被选中 → 变成绿色主题（和难度卡片一致） */
        .mode_card label:has(input:checked) {
            border-color: #5cdb8a;
            background: rgba(92, 219, 138, 0.12);
            color: #c8e8d4;
            box-shadow: 0 0 24px rgba(92, 219, 138, 0.04);
        }

        /* 复选框本身：小而精致，和主题统一 */
        .mode_card label input[type="checkbox"] {
            accent-color: #5cdb8a;
            width: 16px;
            height: 16px;
            margin-right: 10px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* 模式名称 + 小字 */
        .mode_card label .mode-name {
            font-weight: 600;
            font-size: 1rem;
        }
        .mode_card label .mode-meta {
            font-size: 0.7rem;
            opacity: 0.6;
            width: 100%;
            padding-left: 28px;
            margin-top: -4px;
            margin-bottom: 2px;
        }
        /* ===== 开始按钮 ===== */
        .start_button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #5cdb8a, #3a9e5e);
            color: #0f1f12;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(92, 219, 138, 0.2);
            margin-top: 8px;
        }
        .start_button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(92, 219, 138, 0.35);
        }
        .start_button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== 游戏界面 HUD ===== */
        #scorePlay {
            font-size: 16px;
            font-weight: 600;
            color: #8fdfb0;
            white-space: pre-line;
        }
        #progressPlaying {
            font-size: 14px;
            color: rgba(92, 219, 138, 0.6);
            margin: 6px 0 14px;
        }

        /* ===== 播放按钮 ===== */
        .play_button {
            display: inline-block;
            background: rgba(92, 219, 138, 0.12);
            border: 1px solid rgba(92, 219, 138, 0.2);
            color: #8fdfb0;
            padding: 10px 28px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 14px;
        }
        .play_button:hover {
            background: rgba(92, 219, 138, 0.2);
            border-color: #5cdb8a;
        }

        /* ===== 选项按钮（补全） ===== */
        .option-btn {
            /* 已在上面与 label 合并定义 */
        }
        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* ===== 正确/错误反馈 ===== */
        .option-btn.opt-correct {
            border-color: #36a87a !important;
            background: rgba(54, 168, 122, 0.2) !important;
            color: #8fd4b8 !important;
        }
        .option-btn.opt-wrong {
            border-color: #d45a6a !important;
            background: rgba(212, 90, 106, 0.2) !important;
            color: #f0a0aa !important;
        }

        /* ===== 返回按钮 ===== */
        #backToMenuBtn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(92, 219, 138, 0.15);
            color: #8fdfb0;
            padding: 12px 30px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 16px;
        }
        #backToMenuBtn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== 设置面板和游戏面板切换 ===== */
        #setupPanel, #gamePanel {
            transition: opacity 0.3s;
        }
    </style>
</head>

<body>

<!--设置面板-->
    <div id="app">
        <h1>东方Project原曲听力测试</h1>
<div id="setupPanel">
    <div class="diff_card">   <!--难度选择-->
    <label>
        <input type="radio" name="difficulty" value="E">
        <span class="diff-name">Easy</span>
        <span class="diff-meta">🎵 播放6 秒片段</span>
    </label>
    <label>
        <input type="radio" name="difficulty" value="N">
        <span class="diff-name">Normal</span>
        <span class="diff-meta">🎵 播放5 秒片段</span>
    </label>
   <label>
       <input type="radio" name="difficulty" value="H">
       <span class="diff-name">Hard</span>
       <span class="diff-meta">🎵 播放3 秒片段</span>
   </label>
    <label>
        <input type="radio" name="difficulty" value="L">
        <span class="diff-name">Lunatic</span>
        <span class="diff-meta">🎵 播放1.5 秒片段</span>
    </label>
</div>
    <div class="mode_card">  <!--模式选择-->

    <label>
        <input type="checkbox" name="endlessRun">
        <span class="mode-name">开启无尽模式</span>
        <span class="mode-meta">前7题仍然是标准模式，通关后将继续游玩，直到连错4题</span>
    </label>
    </div>
    <button type="button" class="start_button">开始游戏</button>
</div>

    <!--游戏面板-->
    <div id="gamePanel" style="display: none;">
        <div id="scorePlay">得分:0</div>
        <div id="progressPlaying">第1题</div>
        <button type="button" class="play_button">播放</button>
        <div id="optionsContainer"></div>
        <button type="button" id="backToMenuBtn" style="display: none; margin-top: 20px; padding: 12px 30px; border: none; border-radius: 12px; background: #4a6a80; color: white; font-size: 16px; cursor: pointer;">
            返回主菜单
        </button>
    </div>
    </div>
</body>

<script src="song_database.js"></script>    <!--调用曲目数据库 -->
<script>
    <!-- 按钮相关 -->
    const ui ={
        startButton :document.querySelector(".start_button"),
        diffButton : document.querySelectorAll('input[name="difficulty"]'),
        endlessRunCheckbox : document.querySelector('input[name="endlessRun"]'),
        setupPanel: document.getElementById('setupPanel'),
        gamePanel: document.getElementById('gamePanel'),
        scoreDisplay: document.getElementById('scorePlay'),
        progressDisplay: document.getElementById('progressPlaying'),
        optionsContainer: document.getElementById('optionsContainer'),
        playBtn: document.querySelector('.play_button'),
        backBtn: document.getElementById('backToMenuBtn'),
        startBtn: document.querySelector('.start_button'),
    };


    <!--计分相关-->
    const game ={
        score : 0,          // 总得分
        wrongStreak : 0,    // 当前连续错误次数
        totalWrong : 0,     //记录总共错误的题目数量，只在前七题发挥作用
        questionCount : 0,  // 当前题目序号（方便展示）
        timerId : null ,    // 用来存储定时器，以便提前终止
        correctAnswer:null, //正确答案
        isGameOver:false, //判定是否改结束游戏
        audio:null,         //播放的音频
        clipDuration:-1,     //从音频文件中截取的片段长度
        currentStartTime:0,
        playTimer:null,
    };

    const setup={
        currentDiff : null,
        gameMode :null
    };
    <!--曲目相关-->
    const allSongs = [
        ...song_database.Scarlet_Devil,
        ...song_database.Perfect_Cherry,
        ...song_database.Imperishable_Night
    ];

    //计算播放起始点
    function computeStart(totalDuration,clipDuration){
        if(!totalDuration||clipDuration<0) return 0;
        let low =Math.min(5,totalDuration/2);
        let high =totalDuration-Math.min(5,totalDuration/4);

        if(high-low <clipDuration){
            low = Math.max(0, (totalDuration - clipDuration) / 2);
            high = Math.min(totalDuration, low + clipDuration);
        }

        const maxStart =Math.max(low,high-clipDuration);
        return low+Math.random()*Math.max(0,maxStart-low);
    }
    function playCurrentAudio() {
        if (!game.audio) return;
        // 清除之前的播放定时器
        if (game.playTimer) {
            clearTimeout(game.playTimer);
            game.playTimer = null;
        }
        // 跳转到起始点
        game.audio.currentTime = game.currentStartTime;
        // 播放
        game.audio.play().catch(err => console.warn('播放失败:', err));
        // 设置定时器，在片段结束时自动暂停
        game.playTimer = setTimeout(() => {
            if (game.audio && !game.audio.paused) {
                game.audio.pause();
            }
            game.playTimer = null;
            // 可选：播放结束后启用选项（不过你的选项默认一直可用）
        }, game.clipDuration * 1000);
    }
    function updateStartButton() {
        let isSelected = false;  // 默认没人被选中

        // 遍历所有难度按钮，检查有没有一个被勾选
        for (let btn of ui.diffButton) {
            if (btn.checked) {
                isSelected = true;
                break;  // 只要找到一个被选中的，就立刻停止循环
            }
        }
        // 如果 isSelected 为 true，禁用属性设为 false（启用按钮）
        // 如果 isSelected 为 false，禁用属性设为 true（禁用按钮）
        ui.startButton.disabled = !isSelected;
    }
    updateStartButton();
    for (let btn of ui.diffButton) {
        btn.addEventListener('change', updateStartButton);
    }
    ui.startButton.addEventListener('click',function (){
        for(let btn of ui.diffButton){
            if(btn.checked){
                setup.currentDiff=btn.value;
                break;
            }
        }
        setup.gameMode=ui.endlessRunCheckbox.checked?'endless' : 'standard';
        document.getElementById('setupPanel').style.display = 'none';
        document.getElementById('gamePanel').style.display = 'block';
        function loadQuestion(){
            game.questionCount++;  // 新增：题号+1
            ui.progressDisplay.textContent = '第 ' + game.questionCount + ' 题';  // 更新显示
            const randomIndex =Math.floor(Math.random()*allSongs.length);
            const correctSong =allSongs[randomIndex];
            game.correctAnswer=correctSong;
            const otherSongs =allSongs.filter(song => song !=correctSong);
            const shuffledOthers =otherSongs.sort(() =>Math.random() -0.5);
            const distractors = shuffledOthers.slice(0, 3);
            const allOptions = [correctSong, ...distractors];
            const shuffledOptions = allOptions.sort(() => Math.random() - 0.5);
            const container = ui.optionsContainer;
            container.style.display = 'block';  // 确保容器可以被看见
            container.innerHTML = '';           // 清空旧内容
            ui.playBtn.style.display='block';


            //音频播放模块
            const diffToClip ={'E':6,'N':5,'H':3,'L':1.5};
            game.clipDuration =diffToClip[setup.currentDiff]||-1;
            if(game.audio){
                game.audio.pause();
                game.audio.src='';
                if (game.playTimer) {
                    clearTimeout(game.playTimer);
                    game.playTimer = null;
                }
            }
            const audio = new Audio();
            audio.preload ='metadata';
            audio.src =game.correctAnswer.file;
            game.audio=audio;
            // 3. 监听元数据加载完成
            audio.addEventListener('loadedmetadata', function onMeta() {
                audio.removeEventListener('loadedmetadata', onMeta);
                const totalDuration = audio.duration;
                game.currentStartTime = computeStart(totalDuration, game.clipDuration);
                // 播放片段
                playCurrentAudio();
            });


            audio.load();



            //生成选项
            for (let song of shuffledOptions) {
                const btn = document.createElement('button');
                btn.textContent = song.name;
                // 把歌曲对象存到按钮的自定义属性里（方便比对）
                btn.dataset.songName = song.name;
                btn.className = 'option-btn';   // 加这一行，替代所有 style

                // 基础样式（先写死内联，方便你一眼看清）
                //btn.style.display = 'block';
                //btn.style.width = '100%';
                //btn.style.padding = '12px';
                //btn.style.margin = '6px 0';
                //btn.style.border = '2px solid #dce6ed';
                //btn.style.borderRadius = '10px';
                //btn.style.background = 'white';
                //btn.style.cursor = 'pointer';
                //btn.style.fontSize = '16px';

                // ----- 核心点击逻辑 -----
                btn.addEventListener('click', function() {
                    // 1) 防止重复点击
                    const allBtns = container.querySelectorAll('button');
                    allBtns.forEach(b => b.disabled = true);

                    // 2) 高亮显示正确答案（绿色）—— 这部分可以循环
                    allBtns.forEach(b => {
                        if (b.dataset.songName === correctSong.name) {
                            b.classList.add('opt-correct');
                        }
                    });

                    // 3) 判断对错
                    const isCorrect = (this.dataset.songName === correctSong.name);

                    if (isCorrect) {
                        game.score++;
                        game.wrongStreak = 0;
                        console.log('✅ 答对了！当前得分:', game.score);
                    } else {
                        game.wrongStreak++;
                        game.totalWrong++;
                        this.classList.add('opt-wrong');  // 只把用户点的标红
                        console.log('❌ 答错了，正确答案是：', correctSong.name);
                        console.log('你还有', 4 - game.wrongStreak, '次机会');
                    }

                    // 4) 更新计分显示
                    ui.scoreDisplay.textContent = '得分: ' + game.score;
                    game.audio.pause();

                    // 5) 检查游戏是否应该结束
                    let endMessage ='';
                    if(setup.gameMode==='standard'){
                        if(game.totalWrong>=4 &&game.questionCount===7){
                            game.isGameOver=true;
                            endMessage='💀游戏结束，闯关失败';
                        }else if(game.questionCount>=7){
                            game.isGameOver=true;
                            endMessage='🎉游戏结束，你过关';
                        }
                    }else {
                        if (game.questionCount <= 7) {
                            if (game.totalWrong >= 4 &&game.questionCount===7) {
                                game.isGameOver = true;
                                endMessage = '💀游戏结束，挑战失败'
                            }
                            if (game.questionCount === 7 && game.totalWrong < 4) {
                                console.log('✅ 前 7 题安全通过（当前连错计数：' + game.wrongStreak + '），进入无限模式！');
                            }
                        }else if (game.wrongStreak >= 4) {
                            game.isGameOver=true;
                            endMessage='💀 连续答错 4 题，挑战结束！';
                        }
                    }
                    if(game.isGameOver){
                        clearTimeout(game.timerId);
                        allBtns.forEach(b => b.disabled = true);
                        ui.scoreDisplay.textContent = endMessage +'\n得分：'+game.score;
                        ui.backBtn.style.display = 'block';
                        ui.progressDisplay.textContent='';
                        ui.optionsContainer.style.display = 'none';
                        ui.playBtn.style.display = 'none';
                        return;  // 不进入 setTimeout
                    }
                    // 6) 1.5 秒后自动跳转
                    game.timerId = setTimeout(() => {
                        loadQuestion();
                    }, 1500);
                });
                container.appendChild(btn);
            }
        }
        loadQuestion(); <!--首次调用问题函数-->
    });

    ui.playBtn.addEventListener('click', function () {
        if (!game.audio) {
            alert('没有音频可播放');
            return;
        }
        // 如果正在播放，先暂停重置（为了重播）
        if (!game.audio.paused) {
            game.audio.pause();
        }
        // 重新播放片段
        playCurrentAudio();
    });
    const backToMenuBtn = document.getElementById('backToMenuBtn');
    backToMenuBtn.addEventListener('click',function (){
        clearTimeout(game.timerId);
        game.score =0;
        game.wrongStreak=0;
        game.totalWrong=0;
        game.questionCount=0;
        game.isGameOver=false;
        game.correctAnswer=null;

        ui.gamePanel.style.display='none';
        ui.setupPanel.style.display='block';

        ui.optionsContainer.innerHTML='';
        ui.backBtn.style.display = 'none';      // 隐藏返回按钮
        ui.scoreDisplay.textContent = '得分: 0';          // 重置得分显示
        ui.progressDisplay.textContent = '第1题';      // 重置题号

        updateStartButton();
    });

</script>
</html>
