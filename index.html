<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东方Project原曲听力</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* Vue 完成挂载前隐藏模板，避免闪现 {{ }} 原始文本 */
        [v-cloak] { display: none; }

        body {
            font-family: 'Shippori Mincho', 'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', 'MS PMincho', 'Georgia', 'Times New Roman', serif;
            background:
                radial-gradient(ellipse at 50% -12%, rgba(92, 219, 138, 0.28), transparent 55%),
                radial-gradient(ellipse at 50% 115%, rgba(16, 70, 42, 0.75), transparent 60%),
                linear-gradient(165deg, #0c2417 0%, #123524 45%, #0a1f13 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #d6f2e2;
        }

        /* ===== 主容器（玻璃卡片） ===== */
        #app {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(92, 219, 138, 0.15);
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: all 0.3s;
        }

        /* ===== 标题 ===== */
        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #a4e6c0, #5cdb8a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 4px;
        }
        .subhead {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.78);
            border-bottom: 1px solid rgba(92, 219, 138, 0.12);
            padding-bottom: 16px;
            margin-bottom: 20px;
            letter-spacing: 6px;
        }

        /* ===== 面板 ===== */
        .panel {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 18px;
            border: 1px solid rgba(92, 219, 138, 0.06);
        }
        .panel-title {
            font-weight: 600;
            font-size: 13px;
            color: #7dca9a;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        /* ===== 难度 & 选项卡片 ===== */
        .diff_card {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .diff_card label,
        .option-btn {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px 12px;
            border: 1px solid rgba(92, 219, 138, 0.2);
            padding: 12px 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: 0.2s;
            color: #c8e8d4;
            font-weight: 500;
            width: 100%;
            font-family: inherit;
            font-size: 16px;
            text-align: left;
        }
        .diff_card label:hover,
        .option-btn:hover:not(:disabled) {
            border-color: rgba(92, 219, 138, 0.5);
            background: rgba(92, 219, 138, 0.08);
        }
        .diff_card label:has(input:checked) {
            border-color: #5cdb8a;
            background: rgba(92, 219, 138, 0.12);
            box-shadow: 0 0 24px rgba(92, 219, 138, 0.04);
        }
        .diff_card label input {
            accent-color: #5cdb8a;
            margin-right: 10px;
            width: 16px;
            height: 16px;
        }

        /* ===== 难度小字 ===== */
        .diff_card label .diff-name {
            font-weight: 600;
            font-size: 1rem;
        }
        .diff_card label .diff-meta {
            font-size: 0.7rem;
            opacity: 0.6;
            width: 100%;
            padding-left: 28px;
            margin-top: -4px;
            margin-bottom: 2px;
        }

        /* ===== 模式选择（与难度卡片风格统一，未选中灰色） ===== */
        .mode_card {
            margin: 0;
        }
        .mode_card label {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 12px 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: 0.25s;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 500;
            width: 100%;
            font-family: inherit;
            font-size: 16px;
            text-align: left;
        }
        .mode_card label:hover {
            border-color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.05);
        }
        .mode_card label:has(input:checked) {
            border-color: #5cdb8a;
            background: rgba(92, 219, 138, 0.12);
            color: #c8e8d4;
            box-shadow: 0 0 24px rgba(92, 219, 138, 0.04);
        }
        .mode_card label input[type="checkbox"] {
            accent-color: #5cdb8a;
            width: 16px;
            height: 16px;
            margin-right: 10px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .mode_card label .mode-name {
            font-weight: 600;
            font-size: 1rem;
        }
        .mode_card label .mode-meta {
            font-size: 0.7rem;
            opacity: 0.6;
            width: 100%;
            padding-left: 28px;
            margin-top: -4px;
            margin-bottom: 2px;
        }

        /* ===== 玩法说明小字 ===== */
        .game-hint {
            margin: 18px 0 14px;
            font-size: 12.5px;
            line-height: 1.7;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.55);
            text-align: center;
        }

        /* ===== 开始按钮 ===== */
        .start_button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #5cdb8a, #3a9e5e);
            color: #0f1f12;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(92, 219, 138, 0.2);
            margin-top: 8px;
        }
        .start_button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(92, 219, 138, 0.35);
        }
        .start_button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== 游戏界面 HUD ===== */
        #scorePlay {
            font-size: 16px;
            font-weight: 600;
            color: #8fdfb0;
            white-space: pre-line;
        }
        #progressPlaying {
            font-size: 14px;
            color: rgba(92, 219, 138, 0.6);
            margin: 6px 0 14px;
        }

        /* ===== 生命值（右上角爱心） ===== */
        .game-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }
        .lives-box {
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .lives-heart {
            font-size: 16px;
            line-height: 1;
            filter: drop-shadow(0 0 3px rgba(212, 90, 106, 0.35));
        }
        /* 仅剩 1 点生命时轻微上下晃动，增加紧张感 */
        .lives-shake {
            animation: livesShake 0.6s ease-in-out infinite;
        }
        @keyframes livesShake {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-2px); }
        }

        /* ===== 播放按钮 ===== */
        .play_button {
            display: inline-block;
            background: rgba(92, 219, 138, 0.12);
            border: 1px solid rgba(92, 219, 138, 0.2);
            color: #8fdfb0;
            padding: 10px 28px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 14px;
        }
        .play_button:hover {
            background: rgba(92, 219, 138, 0.2);
            border-color: #5cdb8a;
        }

        /* ===== 选项按钮 ===== */
        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* ===== 正确/错误反馈 ===== */
        .option-btn.opt-correct {
            border-color: #36a87a !important;
            background: rgba(54, 168, 122, 0.2) !important;
            color: #8fd4b8 !important;
        }
        .option-btn.opt-wrong {
            border-color: #d45a6a !important;
            background: rgba(212, 90, 106, 0.2) !important;
            color: #f0a0aa !important;
        }

        /* ===== 返回按钮 ===== */
        #backToMenuBtn {
            margin-top: 20px;
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            background: #4a6a80;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        #backToMenuBtn:hover {
            background: #5b829e;
        }

        /* ===== 设置面板左右两栏布局 ===== */
        .setup_columns {
            display: flex;
            gap: 20px;
            align-items: stretch;
        }
        .setup_col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .setup_col .panel-title {
            margin: 0;
        }

        /* 选项卡稍大一点：加大内边距与字号 */
        .diff_card label,
        .mode_card label {
            padding: 14px 20px;
        }
        .diff_card label .diff-name,
        .mode_card label .mode-name {
            font-size: 1.05rem;
        }
        .diff_card label .diff-meta,
        .mode_card label .mode-meta {
            font-size: 0.75rem;
        }

        @media (max-width: 620px) {
            .setup_columns {
                flex-direction: column;
            }
        }

        /* ===== 面板切换 ===== */
        #setupPanel, #gamePanel {
            transition: opacity 0.3s;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Noto+Serif+JP:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- midi-parser-js：解析 MIDI 文件，暴露全局 MidiParser -->
    <script src="https://cdn.jsdelivr.net/npm/midi-parser-js@4.0.4/src/main.js"></script>
    <!-- Vue 3 全局构建：暴露全局 Vue，无需打包工具 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
</head>

<body>

<div id="app" v-cloak>
    <h1>东方Project原曲听力测试</h1>
    <div class="subhead">～ Guess the Song.</div>

    <!-- 设置面板（v-if 控制显示） -->
    <div id="setupPanel" v-if="view === 'setup'">
        <div class="setup_columns">
            <!-- 左半：选择难度 + 开启无尽模式 -->
            <div class="setup_col">
                <div class="panel-title">选择难度</div>
                <div class="diff_card">
                    <!-- v-for 渲染难度选项；v-model 绑定选中的难度 -->
                    <label v-for="d in difficulties" :key="d.value">
                        <input type="radio" name="difficulty" :value="d.value" v-model="difficulty">
                        <span class="diff-name">{{ d.name }}</span>
                        <span class="diff-meta">{{ d.meta }}</span>
                    </label>
                </div>

                <div class="mode_card">
                    <!-- 无尽模式开关（布尔值 v-model） -->
                    <label>
                        <input type="checkbox" v-model="endlessRun">
                        <span class="mode-name">开启无尽模式</span>
                        <span class="mode-meta">前7题仍然是标准模式，通关后将继续游玩，直到生命归零</span>
                    </label>
                </div>
            </div>

            <!-- 右半：选择作品 -->
            <div class="setup_col">
                <div class="panel-title">选择作品</div>
                <div class="mode_card">
                    <!-- 作品选择 复选框数组 v-model -->
                    <label v-for="w in works" :key="w.value">
                        <input type="checkbox" name="Work" :value="w.value" v-model="selectedWorks">
                        <span class="mode-name">{{ w.name }}</span>
                        <span class="mode-meta">{{ w.meta }}</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 玩法说明小字 -->
        <p class="game-hint">🎧 玩法：选好难度与作品后开始，听一段随机旋律，从四个曲名中选出正确答案；标准模式共 7 题。</p>
        <p class="game-hint">进入无尽模式后，答对一题恢复1生命值</p>
        <!-- :disabled 由 canStart 计算属性决定（等价于原 updateStartButton） -->
        <button type="button" class="start_button" :disabled="!canStart" @click="startGame">开始游戏</button>
    </div>

    <!-- 游戏面板 -->
    <div id="gamePanel" v-else>
        <div class="game-hud">
            <div id="scorePlay">{{ scoreText }}</div>
            <!-- 生命值爱心：仅剩 1 点时晃动 -->
            <div class="lives-box" v-if="!isGameOver" :class="{ 'lives-shake': lives === 1 }">
                <span class="lives-heart" v-for="(h, i) in hearts" :key="i">{{ h }}</span>
            </div>
        </div>
        <div id="progressPlaying">{{ progressText }}</div>
        <button type="button" class="play_button" v-if="!isGameOver" @click="replay">播放</button>
        <div id="optionsContainer" v-if="!isGameOver">
            <!-- v-for 渲染选项按钮；:class 动态高亮对错 -->
            <button
                type="button"
                v-for="song in options"
                :key="song.file"
                class="option-btn"
                :class="optionClass(song)"
                :disabled="answered"
                @click="answer(song)"
            >{{ song.name }}</button>
        </div>
        <button type="button" id="backToMenuBtn" v-if="isGameOver" @click="backToMenu">返回主菜单</button>
    </div>
</div>

<!-- Vue 加载失败的兜底提示 -->
<div id="vueFallback" class="subhead" style="display:none; color:#f0a0aa; border:none; padding:24px;">
    ⚠️ 无法加载 Vue.js（可能是网络 / CDN 问题），请检查网络后刷新。
</div>

<script src="song_database.js"></script>
<script>
/* ==========================================================================
 * 1. MIDI 播放引擎（纯 Web Audio 合成）
 *    与 Vue 解耦：Vue 只负责界面与状态，音频引擎用普通对象保存内部状态，
 *    不需要响应式，避免 Vue 去追踪大量音符对象造成性能浪费。
 * ========================================================================== */

// 音符编号 → 频率
function midiToFreq(note) {
    return 440 * Math.pow(2, (note - 69) / 12);
}
// GM 标准：0 起算的第 9 通道是打击乐通道
function isPercussionChannel(channel) {
    return channel === 9;
}

const midi = {
    ctx: null,
    masterGain: null,
    noiseBuffer: null,
    notes: [],          // 当前曲目音符 [{start,end,note,velocity,channel}]
    fullDuration: 0,    // 当前曲目总时长（秒）
    schedule: [],       // 当前片段事件（相对时间）[{time,kind,note,velocity,channel}]
    nextIndex: 0,
    startCtxTime: 0,
    clipDuration: 0,
    timerId: null,
    activeNotes: {},    // key = "channel:note" → [{osc, gain, peak}]
    playing: false,
};

// 与「当前这一题」相关的音频状态（非响应式）
const audioState = {
    midiNotes: [],
    currentClip: null,
    currentOffset: 0,
    clipDuration: -1,
};

function midiInit() {
    if (midi.ctx) return midi.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    midi.ctx = new AC();
    midi.masterGain = midi.ctx.createGain();
    midi.masterGain.gain.value = 0.25;
    const comp = midi.ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 24;
    comp.ratio.value = 8;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;
    midi.masterGain.connect(comp);
    comp.connect(midi.ctx.destination);
    return midi.ctx;
}

/* ---- 解析 MIDI：提取 Note On/Off 与 Tempo ---- */
function extractEvents(parsed) {
    const tempoEvents = [];
    const noteEvents = [];
    for (const track of parsed.track) {
        if (!track || !Array.isArray(track.event)) continue;
        let tick = 0;
        for (const ev of track.event) {
            tick += ev.deltaTime || 0;
            if (ev.metaType === 0x51) { // Set Tempo
                let uspq = 500000;
                const d = ev.data;
                if (Array.isArray(d) && d.length >= 3) uspq = (d[0] << 16) | (d[1] << 8) | (d[2] || 0);
                else if (typeof d === 'number' && d > 0) uspq = d;
                if (!uspq || uspq <= 0) uspq = 500000;
                tempoEvents.push({ tick, uspq });
            } else if (ev.type === 9) { // Note On（力度 0 视作 Note Off）
                const d = Array.isArray(ev.data) ? ev.data : [];
                if (d[0] == null) continue;
                noteEvents.push({ tick, kind: d[1] > 0 ? 'on' : 'off', note: d[0], velocity: d[1], channel: ev.channel || 0 });
            } else if (ev.type === 8) { // Note Off
                const d = Array.isArray(ev.data) ? ev.data : [];
                if (d[0] == null) continue;
                noteEvents.push({ tick, kind: 'off', note: d[0], velocity: d[1] || 0, channel: ev.channel || 0 });
            }
        }
    }
    return { tempoEvents, noteEvents };
}

function buildSchedule(tempoEvents, noteEvents, tpq) {
    if (!tpq || tpq <= 0) tpq = 480;
    tempoEvents.sort((a, b) => a.tick - b.tick);
    noteEvents.sort((a, b) => a.tick - b.tick);
    const schedule = [];
    let ti = 0, uspq = 500000, curTick = 0, curSec = 0;
    for (const ne of noteEvents) {
        while (ti < tempoEvents.length && tempoEvents[ti].tick <= ne.tick) {
            const te = tempoEvents[ti];
            curSec += ((te.tick - curTick) / tpq) * (uspq / 1e6);
            curTick = te.tick;
            uspq = (te.uspq && te.uspq > 0) ? te.uspq : uspq;
            ti++;
        }
        const sec = curSec + ((ne.tick - curTick) / tpq) * (uspq / 1e6);
        schedule.push({ time: sec, kind: ne.kind, note: ne.note, velocity: ne.velocity, channel: ne.channel });
    }
    return schedule;
}

function buildNotes(schedule) {
    const notes = [], open = {};
    for (const ev of schedule) {
        const key = ev.channel + ':' + ev.note;
        if (ev.kind === 'on') {
            (open[key] || (open[key] = [])).push({ start: ev.time, note: ev.note, velocity: ev.velocity, channel: ev.channel });
        } else {
            const arr = open[key];
            if (arr && arr.length) {
                const n = arr.shift();
                notes.push({ start: n.start, end: ev.time, note: n.note, velocity: n.velocity, channel: n.channel });
            }
        }
    }
    for (const key in open) {
        for (const n of open[key]) {
            notes.push({ start: n.start, end: n.start + 0.25, note: n.note, velocity: n.velocity, channel: n.channel });
        }
    }
    return notes;
}

// 从音符列表切出 [offset, offset+duration)，返回相对时间事件流
function buildClipSchedule(notes, offset, duration) {
    const clip = [];
    for (const n of notes) {
        const cs = Math.max(n.start, offset);
        const ce = Math.min(n.end, offset + duration);
        if (cs < ce) {
            clip.push({ time: cs - offset, kind: 'on', note: n.note, velocity: n.velocity, channel: n.channel });
            clip.push({ time: ce - offset, kind: 'off', note: n.note, velocity: 0, channel: n.channel });
        }
    }
    clip.sort((a, b) => a.time - b.time || (a.kind === 'on' ? -1 : 1));
    return clip;
}

/* ---- 鼓组合成（GM 打击乐通道） ---- */
function getNoiseBuffer(ctx) {
    if (!midi.noiseBuffer) {
        const len = Math.floor(ctx.sampleRate * 1.5);
        midi.noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = midi.noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return midi.noiseBuffer;
}
function noiseSource(ctx) {
    const src = ctx.createBufferSource();
    src.buffer = getNoiseBuffer(ctx);
    return src;
}
function drumVol(velocity) {
    return Math.max(0.001, Math.min(1, velocity / 127) * 0.7);
}
function drumKick(ctx, when, vol) {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, when);
    osc.frequency.exponentialRampToValueAtTime(45, when + 0.12);
    gain.gain.setValueAtTime(vol, when);
    gain.gain.exponentialRampToValueAtTime(0.001, when + 0.4);
    osc.connect(gain); gain.connect(midi.masterGain);
    osc.start(when); osc.stop(when + 0.45);
}
function drumSnare(ctx, when, vol) {
    const osc = ctx.createOscillator(); osc.type = 'triangle';
    osc.frequency.setValueAtTime(190, when);
    const og = ctx.createGain();
    og.gain.setValueAtTime(vol * 0.7, when);
    og.gain.exponentialRampToValueAtTime(0.001, when + 0.12);
    osc.connect(og); og.connect(midi.masterGain);
    osc.start(when); osc.stop(when + 0.15);
    const noise = noiseSource(ctx);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(vol * 0.6, when);
    ng.gain.exponentialRampToValueAtTime(0.001, when + 0.18);
    noise.connect(hp); hp.connect(ng); ng.connect(midi.masterGain);
    noise.start(when); noise.stop(when + 0.2);
}
function drumSideStick(ctx, when, vol) {
    const noise = noiseSource(ctx);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 1.5;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol * 0.8, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 0.06);
    noise.connect(bp); bp.connect(g); g.connect(midi.masterGain);
    noise.start(when); noise.stop(when + 0.08);
}
function drumClap(ctx, when, vol) {
    for (let i = 0; i < 3; i++) {
        const t = when + i * 0.02;
        const noise = noiseSource(ctx);
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1200; bp.Q.value = 1;
        const g = ctx.createGain();
        g.gain.setValueAtTime(vol * (i === 0 ? 0.9 : 0.5), t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        noise.connect(bp); bp.connect(g); g.connect(midi.masterGain);
        noise.start(t); noise.stop(t + 0.06);
    }
}
function drumHat(ctx, when, vol, open) {
    const noise = noiseSource(ctx);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol * 0.5, when);
    const decay = open ? 0.55 : 0.07;
    g.gain.exponentialRampToValueAtTime(0.001, when + decay);
    noise.connect(hp); hp.connect(g); g.connect(midi.masterGain);
    noise.start(when); noise.stop(when + decay + 0.05);
}
function drumTom(ctx, when, vol, note) {
    const osc = ctx.createOscillator(); osc.type = 'sine';
    const base = midiToFreq(note);
    osc.frequency.setValueAtTime(base, when);
    osc.frequency.exponentialRampToValueAtTime(base * 0.7, when + 0.15);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol * 0.9, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 0.32);
    osc.connect(g); g.connect(midi.masterGain);
    osc.start(when); osc.stop(when + 0.35);
}
function drumCymbal(ctx, when, vol) {
    const noise = noiseSource(ctx);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol * 0.55, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 1.3);
    noise.connect(hp); hp.connect(g); g.connect(midi.masterGain);
    noise.start(when); noise.stop(when + 1.35);
}
function drumShaker(ctx, when, vol) {
    const noise = noiseSource(ctx);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2000 + Math.random() * 2000; bp.Q.value = 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol * 0.45, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 0.09);
    noise.connect(bp); bp.connect(g); g.connect(midi.masterGain);
    noise.start(when); noise.stop(when + 0.11);
}
function drumPitched(ctx, when, vol, note) {
    const osc = ctx.createOscillator(); osc.type = 'triangle';
    osc.frequency.value = midiToFreq(note);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol * 0.6, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 0.16);
    osc.connect(g); g.connect(midi.masterGain);
    osc.start(when); osc.stop(when + 0.18);
}
function playDrum(ctx, when, note, velocity) {
    const vol = drumVol(velocity);
    switch (note) {
        case 35: case 36:                       drumKick(ctx, when, vol); break;
        case 38: case 40:                       drumSnare(ctx, when, vol); break;
        case 37:                                drumSideStick(ctx, when, vol); break;
        case 39:                                drumClap(ctx, when, vol); break;
        case 42: case 44:                       drumHat(ctx, when, vol, false); break;
        case 46:                                drumHat(ctx, when, vol, true); break;
        case 41: case 43: case 45:
        case 47: case 48: case 50:
        case 62: case 63: case 64:              drumTom(ctx, when, vol, note); break;
        case 49: case 51: case 52:
        case 53: case 55: case 57: case 59:     drumCymbal(ctx, when, vol); break;
        case 54: case 56: case 69: case 70:
        case 73: case 74: case 75:
        case 78: case 79:                       drumShaker(ctx, when, vol); break;
        default:                                drumPitched(ctx, when, vol, note);
    }
}

/* ---- 发声与调度 ---- */
function midiNoteOn(ctx, when, ev) {
    if (isPercussionChannel(ev.channel)) { playDrum(ctx, when, ev.note, ev.velocity); return; }
    const key = ev.channel + ':' + ev.note;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'square'; // 旋律方波
    osc.frequency.value = midiToFreq(ev.note);
    const peak = 0.3 * (ev.velocity / 127);
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.linearRampToValueAtTime(peak, when + 0.006);
    osc.connect(gain); gain.connect(midi.masterGain);
    osc.start(when);
    (midi.activeNotes[key] || (midi.activeNotes[key] = [])).push({ osc, gain, peak });
}
function midiNoteOff(ctx, when, ev) {
    const key = ev.channel + ':' + ev.note;
    const arr = midi.activeNotes[key];
    if (!arr || !arr.length) return;
    const item = arr.shift();
    const release = 0.09;
    item.gain.gain.cancelScheduledValues(when);
    item.gain.gain.setValueAtTime(Math.max(0.0001, item.peak), when);
    item.gain.gain.linearRampToValueAtTime(0.0001, when + release);
    item.osc.stop(when + release + 0.02);
}
function midiHasActive() {
    for (const k in midi.activeNotes) if (midi.activeNotes[k].length) return true;
    return false;
}
function midiForceStop() {
    if (!midi.ctx) return;
    const now = midi.ctx.currentTime;
    for (const k in midi.activeNotes) {
        for (const item of midi.activeNotes[k]) {
            try { item.gain.gain.cancelScheduledValues(now); } catch (e) {}
            try { item.gain.gain.setValueAtTime(0.0001, now); } catch (e) {}
            try { item.gain.gain.linearRampToValueAtTime(0.0001, now + 0.05); } catch (e) {}
            try { item.osc.stop(now + 0.08); } catch (e) {}
        }
    }
    midi.activeNotes = {};
}

const LOOKAHEAD = 0.15;
const TICK_MS = 40;
function midiSchedulerTick() {
    const ctx = midi.ctx;
    const elapsed = ctx.currentTime - midi.startCtxTime;
    while (midi.nextIndex < midi.schedule.length) {
        const ev = midi.schedule[midi.nextIndex];
        const when = midi.startCtxTime + ev.time;
        if (when > ctx.currentTime + LOOKAHEAD) break;
        if (ev.kind === 'on') midiNoteOn(ctx, when, ev);
        else midiNoteOff(ctx, when, ev);
        midi.nextIndex++;
    }
    if (midi.nextIndex >= midi.schedule.length) {
        if (!midiHasActive()) midiFinish();
        else if (elapsed > midi.clipDuration + 1.5) { midiForceStop(); midiFinish(); }
    }
}
function midiStart() {
    if (!midi.schedule.length) return;
    midi.ctx = midiInit();
    midi.nextIndex = 0;
    midi.startCtxTime = midi.ctx.currentTime + 0.1;
    midi.activeNotes = {};
    midi.playing = true;
    if (midi.timerId) clearInterval(midi.timerId);
    midi.timerId = setInterval(midiSchedulerTick, TICK_MS);
}
function midiStop() {
    if (midi.timerId) { clearInterval(midi.timerId); midi.timerId = null; }
    midi.playing = false;
    midiForceStop();
}
function midiFinish() {
    if (midi.timerId) { clearInterval(midi.timerId); midi.timerId = null; }
    midi.playing = false;
    midi.activeNotes = {};
}

/* ---- 对外接口 ---- */
async function loadMidiNotes(file) {
    const resp = await fetch(file);
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' (' + file + ')');
    const ab = await resp.arrayBuffer();
    const parsed = MidiParser.parse(new Uint8Array(ab));
    if (!parsed || !parsed.track) throw new Error('MIDI 解析失败');
    const { tempoEvents, noteEvents } = extractEvents(parsed);
    const fullSchedule = buildSchedule(tempoEvents, noteEvents, parsed.timeDivision || 480);
    midi.notes = buildNotes(fullSchedule);
    midi.fullDuration = fullSchedule.length ? fullSchedule[fullSchedule.length - 1].time : 0;
    return midi.notes;
}

// 随机截取（无音符则重试）
function makeRandomClip(notes, duration) {
    if (!notes || !notes.length) return null;
    const maxOffset = Math.max(0, midi.fullDuration - duration);
    for (let i = 0; i < 60; i++) {
        const offset = maxOffset > 0 ? Math.random() * maxOffset : 0;
        const clip = buildClipSchedule(notes, offset, duration);
        if (clip.some(e => e.kind === 'on')) return { offset, schedule: clip };
    }
    const n = notes[Math.floor(Math.random() * notes.length)];
    const offset = Math.max(0, Math.min(n.start, maxOffset));
    return { offset, schedule: buildClipSchedule(notes, offset, duration) };
}

// 播放某个片段（相对时间事件流）
function playMidiClip(schedule, duration) {
    midi.schedule = schedule;
    midi.clipDuration = duration;
    midiStart();
}

// 为当前题目随机生成并播放一个片段
function buildAndPlayClip() {
    if (!audioState.midiNotes || !audioState.midiNotes.length) return;
    const r = makeRandomClip(audioState.midiNotes, audioState.clipDuration);
    if (!r) return;
    audioState.currentClip = r.schedule;
    audioState.currentOffset = r.offset;
    playMidiClip(audioState.currentClip, audioState.clipDuration);
}

// 重播当前题目已有的片段
function replayCurrentClip() {
    if (!audioState.currentClip || !audioState.currentClip.length) {
        buildAndPlayClip();
        return;
    }
    playMidiClip(audioState.currentClip, audioState.clipDuration);
}

/* ==========================================================================
 * 2. Vue 应用
 * ========================================================================== */

let advanceTimer = null; // 答完一题后自动切到下一题的定时器（非响应式）

if (window.Vue) {
Vue.createApp({
    data() {
        return {
            // 静态配置
            difficulties: [
                { value: 'E', name: 'Easy', meta: '🎵 播放6 秒片段' },
                { value: 'N', name: 'Normal', meta: '🎵 播放5 秒片段' },
                { value: 'H', name: 'Hard', meta: '🎵 播放3 秒片段' },
                { value: 'L', name: 'Lunatic', meta: '🎵 播放1.5 秒片段' },
            ],
            works: [
                { value: 'new', name: 'TH06-TH18', meta: '东方新作部分，自红魔乡开始到虹龙洞（永夜抄之后内容正在添加中）' },
                { value: 'ancient', name: 'TH01-TH05', meta: '东方旧作部分，自灵异传开始到怪绮谈' },
            ],

            // 响应式状态
            difficulty: null,        // 选中的难度 'E'|'N'|'H'|'L'
            endlessRun: false,       // 无尽模式
            selectedWorks: [],       // 选中的作品 'new' / 'ancient'
            view: 'setup',           // 'setup' | 'game'
            score: 0,
            lives: 4,                // 剩余生命值（初始 4 点）
            totalWrong: 0,           // 总错误次数（标准模式 7 题对 4 题判定用）
            consecutiveCorrect: 0,   // 连续答对题数（用于无尽模式奖励）
            bonusAwarded: false,     // 连续答对 4 题的奖励是否已发放（仅一次）
            questionCount: 0,
            isGameOver: false,
            endMessage: '',
            correctAnswer: null,     // 当前题目正确答案对象
            wrongPick: null,         // 用户点错的那个选项
            answered: false,         // 本题是否已作答
            options: [],             // 当前题目的四个选项
        };
    },

    computed: {
        // 等价于原来的 selectWork：把选中的作品合并成 allSongs。
        // 因为用 computed，selectedWorks 变化时会自动重新计算，且每次都是全新的数组，不会累积重复。
        allSongs() {
            const workMap = {
                new: ['Scarlet_Devil', 'Perfect_Cherry', 'Imperishable_Night'],
                ancient: ['Responsive_to_Prayers', 'Eastern_Wonderland', 'Dim_Dream', 'Lotus_Land_Story', 'Mystic_Square'],
            };
            const list = [];
            for (const w of this.selectedWorks) {
                for (const key of (workMap[w] || [])) {
                    if (Array.isArray(song_database[key])) list.push(...song_database[key]);
                }
            }
            return list;
        },

        // 等价于原来的 updateStartButton：难度 + 至少一个作品都选了才可开始
        canStart() {
            return this.difficulty !== null && this.selectedWorks.length > 0;
        },

        scoreText() {
            if (this.isGameOver) return this.endMessage + '\n得分：' + this.score;
            return '得分: ' + this.score;
        },

        progressText() {
            if (this.isGameOver) return '';
            return '第 ' + this.questionCount + ' 题';
        },

        // 生命值爱心数组：❤️=剩余生命，💛=无尽奖励的第 5 颗心，🤍=归零时的灰心
        hearts() {
            // 生命归 0：保留 1 颗灰心，避免全空
            if (this.lives === 0) return ['🤍'];

            const arr = [];
            const red = Math.min(this.lives, 4);   // 普通生命（最多 4 颗红心）
            for (let i = 0; i < red; i++) arr.push('❤️');
            if (this.lives > 4) arr.push('💛');     // 无尽奖励的第 5 颗金心
            return arr;
        },
    },

    methods: {
        startGame() {
            if (!this.canStart) return;
            midiInit();
            if (midi.ctx.state === 'suspended') midi.ctx.resume().catch(() => {});
            this.resetGame();
            this.view = 'game';
            this.loadQuestion();
        },

        resetGame() {
            clearTimeout(advanceTimer);
            midiStop();
            this.score = 0;
            this.lives = 4;
            this.totalWrong = 0;
            this.consecutiveCorrect = 0;
            this.bonusAwarded = false;
            this.questionCount = 0;
            this.isGameOver = false;
            this.endMessage = '';
            this.correctAnswer = null;
            this.wrongPick = null;
            this.answered = false;
            this.options = [];
            audioState.midiNotes = [];
            audioState.currentClip = null;
            audioState.currentOffset = 0;
        },

        loadQuestion() {
            if (this.isGameOver) return;
            this.questionCount++;
            this.answered = false;
            this.wrongPick = null;
            this.correctAnswer = null;
            this.options = [];

            const songs = this.allSongs; // computed 属性，读一次
            if (!songs.length) {
                alert('曲目列表为空，请返回主菜单重新选择作品。');
                this.backToMenu();
                return;
            }

            const correctSong = songs[Math.floor(Math.random() * songs.length)];
            this.correctAnswer = correctSong;

            // 从其它曲子里随机抽 3 个干扰项
            const others = songs.filter(s => s !== correctSong);
            const distractors = others.sort(() => Math.random() - 0.5).slice(0, 3);
            this.options = [correctSong, ...distractors].sort(() => Math.random() - 0.5);

            // 难度 → 片段时长
            const diffToClip = { E: 6, N: 5, H: 3, L: 1.5 };
            audioState.clipDuration = diffToClip[this.difficulty] || -1;

            // 停止上一题可能还在播放的声音
            midiStop();

            const file = correctSong.file;
            loadMidiNotes(file).then((notes) => {
                // 防止快速切题竞态：仅当仍是这道题时才播放
                if (!this.correctAnswer || this.correctAnswer.file !== file) return;
                audioState.midiNotes = notes;
                buildAndPlayClip();
            }).catch((err) => {
                console.error('加载 MIDI 失败:', err);
                alert('MIDI 加载失败：' + err.message + '\n请通过本地服务器或部署后的网站访问本页。');
            });
        },

        answer(song) {
            if (this.answered || this.isGameOver) return;
            this.answered = true;

            const isCorrect = song === this.correctAnswer;
            if (isCorrect) {
                this.score++;
                this.consecutiveCorrect++;

                // 无尽模式：正式进入无尽（第 8 题起）后，答对回 1 点血（上限 4）
                if (this.endlessRun && this.questionCount > 7 && this.lives < 4) {
                    this.lives++;
                }

                // 无尽模式奖励：连续答对 4 题额外 +1 点血（4+1 形式，仅一次）
                if (this.endlessRun && this.consecutiveCorrect >= 4 && !this.bonusAwarded && this.questionCount > 7) {
                    this.bonusAwarded = true;
                    this.lives++;
                }
            } else {
                this.consecutiveCorrect = 0;
                this.totalWrong++;
                this.lives = Math.max(0, this.lives - 1);
                this.wrongPick = song;
            }
            midiStop();

            this.endMessage = '';
            if (!this.endlessRun) {
                // 标准模式：固定 7 题，错满 4 题即失败（无回血）
                if (this.totalWrong >= 4 && this.questionCount === 7) {
                    this.isGameOver = true;
                    this.endMessage = '💀游戏结束，闯关失败';
                } else if (this.questionCount >= 7) {
                    this.isGameOver = true;
                    this.endMessage = '🎉游戏结束，你过关';
                }
            } else {
                // 无尽模式：前 7 题仍是标准规则；第 8 题起按生命值判定
                if (this.questionCount <= 7) {
                    if (this.totalWrong >= 4 && this.questionCount === 7) {
                        this.isGameOver = true;
                        this.endMessage = '💀游戏结束，挑战失败';
                    }
                } else if (this.lives <= 0) {
                    this.isGameOver = true;
                    this.endMessage = '💀 生命值耗尽，挑战结束！';
                }
            }

            if (this.isGameOver) {
                clearTimeout(advanceTimer);
                return;
            }
            advanceTimer = setTimeout(() => this.loadQuestion(), 1500);
        },

        replay() {
            midiInit();
            if (midi.ctx.state === 'suspended') midi.ctx.resume().catch(() => {});
            if (!audioState.midiNotes || !audioState.midiNotes.length) {
                alert('音频还在加载中，请稍候再点');
                return;
            }
            replayCurrentClip();
        },

        backToMenu() {
            this.resetGame();
            this.view = 'setup';
        },

        // 根据作答情况返回高亮 class
        optionClass(song) {
            if (!this.answered) return '';
            if (song === this.correctAnswer) return 'opt-correct';
            if (song === this.wrongPick) return 'opt-wrong';
            return '';
        },
    },
}).mount('#app');
}

/* Vue 加载失败兜底 */
window.addEventListener('load', () => {
    setTimeout(() => {
        if (!window.Vue) {
            const el = document.getElementById('vueFallback');
            if (el) el.style.display = 'block';
        }
    }, 1500);
});
</script>
